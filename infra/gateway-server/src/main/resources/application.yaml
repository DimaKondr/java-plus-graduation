spring:
  application:
    name: gateway-server
  config:
    import: "configserver:"
  cloud:
    config:
      fail-fast: true
      retry:
        useRandomPolicy: true
        max-interval: 6000
      discovery:
        enabled: true
        service-id: config-server

eureka:
  client:
    service-url:
      default-zone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
    env:
      show-values: always
  endpoint:
    gateway:
      enabled: true