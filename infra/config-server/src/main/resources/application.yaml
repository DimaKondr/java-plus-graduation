server:
  port: 0

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      fail-fast: true
      server:
        native:
          search-locations:
            - "classpath:config/core/{application}"
            - "classpath:config/stats/{application}"
            - "classpath:config/infra/{application}"

eureka:
  client:
    service-url:
      default-zone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/