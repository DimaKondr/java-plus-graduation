server.port=0
client.name=stats-server

stats.client.retry.back-off-period=3000
stats.client.retry.max-attempts:3

spring.sql.init.mode=always

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/ewm-main-service
spring.datasource.username=ewm
spring.datasource.password=ewm

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

#---
spring.config.activate.on-profile=local

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:service-local-db
spring.datasource.username=h2-ewm-main-service-local
spring.datasource.password=password