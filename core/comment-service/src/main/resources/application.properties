spring.application.name=comment-service
spring.config.import=configserver:
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.useRandomPolicy=true
spring.cloud.config.retry.max-interval=6000
spring.cloud.config.discovery.enabled=true
spring.cloud.config.discovery.service-id=config-server

eureka.client.service-url.default-zone=http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/
eureka.instance.prefer-ip-address=true