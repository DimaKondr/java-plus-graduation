server:
  port: 8080

client:
  url: "http://localhost:9090"

spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  sql:
    init:
      mode: always
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:ewm-main-service-test
    username: ewm
    password: ewm
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect